[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gocode"
version = "0.1.0"
description = "A code programming tool that automates the entire development process"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "gocode Team", email = "gocode@example.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
gui = ["kivy>=2.3.0"]
dev = [
    "pytest>=7.4.3,<9",
    "pytest-cov>=4.1.0",
    "sphinx>=7.2.6",
    "astor==0.8.1",
    "pycodestyle==2.11.1",
    "flake8>=7.0.0",
]
crawl = [
    "beautifulsoup4==4.12.2",
    "lxml>=5.1.0",
]
security = ["pyjwt==2.8.0"]
all = [
    "kivy>=2.3.0",
    "pytest>=7.4.3,<9",
    "sphinx>=7.2.6",
    "beautifulsoup4==4.12.2",
    "lxml>=5.1.0",
    "astor==0.8.1",
    "pycodestyle==2.11.1",
    "pyjwt==2.8.0",
    "platformdirs==4.1.0",
    "pytest-cov>=4.1.0",
    "flake8>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/ShiAnLiu/GoCode"
Repository = "https://github.com/ShiAnLiu/GoCode"

[project.scripts]
gocode = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "core*", "utils*", "gui*", "config*", "tests*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
config = ["*.json"]

[tool.flake8]
max-line-length = 120
exclude = [".git", "__pycache__", "*.pyc", "build", "dist", "*.egg-info", ".venv", "venv"]
ignore = ["W503"]

[tool.bandit]
exclude_dirs = [".git", "__pycache__", "tests"]
# subprocess and temp file usage are intentional for this CLI tool
skips = ["B108", "B110", "B404", "B603", "B607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
